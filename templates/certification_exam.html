{% extends "base.html" %}
{% block title %}Certification Exam{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
 <div class="glass-card mb-6">
  <div class="flex items-center gap-3 mb-4">
   <span class="text-3xl">📜</span>
   <div>
    <h1 class="font-grotesk font-bold text-lg text-white mb-0.5">Anti-Doping Certification Exam</h1>
    <p class="text-xs text-slate-400">10 questions • Score 70%+ to get certified</p>
   </div>
  </div>

  <div id="examBox" class="space-y-4">
   <!-- Exam questions rendered by JS -->
  </div>

  <div id="examControls" class="hidden flex justify-between items-center pt-4 border-t border-white/10">
   <button onclick="prevQ()" class="btn-ghost">← Previous</button>
   <button onclick="nextQ()" class="btn-primary">Next →</button>
  </div>

  <div id="examResult" class="hidden text-center py-8">
   <div class="text-5xl mb-4" id="resultEmoji">🏆</div>
   <h2 class="font-grotesk font-black text-xl text-white mb-2" id="resultTitle"></h2>
   <div class="text-3xl font-grotesk font-bold text-indigo-400 mb-2" id="resultScore">0%</div>
   <p class="text-sm text-slate-400 mb-6" id="resultMsg"></p>
   <div id="certBox" class="hidden p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/5">
    <div class="text-emerald-400 font-bold text-sm mb-2">📜 Certificate ID: <span id="certId"></span></div>
    <a href="/certificate" class="btn-primary">Download Certificate</a>
   </div>
  </div>
 </div>
</div>
{% block scripts %}
<script>
const QS=[];let i=0;let answers={};let score=0;
async function loadExam(){
 const r=await fetch('/api/cert-exam');const qs=await r.json();QS.push(...qs);render();
}
function render(){
 const q=QS[i];
 document.getElementById('examBox').innerHTML=`
  <div class="glass-card p-5 rounded-xl">
   <div class="flex justify-between items-start mb-4">
    <span class="text-xs text-slate-400 uppercase font-bold">Question ${i+1} of ${QS.length}</span>
    <span class="text-xs font-bold text-slate-200">${i+1}/${QS.length}</span>
   </div>
   <h3 class="font-bold text-sm text-white mb-4">${q.q}</h3>
   <div class="space-y-2">
    ${q.options.map((o,k)=>`<label class="flex items-center gap-3 p-3 rounded-lg border border-white/10 hover:border-indigo-400 cursor-pointer transition"><input type="radio" name="q${i}" value="${k}" ${answers[i]===k?'checked':''} class="accent-indigo-500"><span class="text-sm text-slate-200">${['A','B','C','D'][k]}. ${o}</span></label>`).join('')}
   </div>
  </div>
 `;
 document.getElementById('examControls').classList.remove('hidden');
 document.getElementById('examResult').classList.add('hidden');
 document.querySelectorAll('input[name="q'+i+'"]').forEach(r=>r.onchange=()=>{answers[i]=parseInt(r.value)});
}
function prevQ(){if(i>0){i--;render()}}
function nextQ(){
 if(i<QS.length-1){i++;render();return}
 finishExam();
}
function finishExam(){
 let correct=0;QS.forEach((q,k)=>{if(answers[k]===q.answer)correct++});
 score=Math.round((correct/QS.length)*100);
 document.getElementById('examBox').classList.add('hidden');
 document.getElementById('examControls').classList.add('hidden');
 const res=document.getElementById('examResult');res.classList.remove('hidden');
 document.getElementById('resultScore').textContent=score+'%';
 const passed=score>=70;
 document.getElementById('resultEmoji').textContent=passed?'🏆':'😕';
 document.getElementById('resultTitle').textContent=passed?'CERTIFIED!':'Not Passed';
 document.getElementById('resultTitle').className=passed?'font-grotesk font-black text-xl text-emerald-400 mb-2':'font-grotesk font-black text-xl text-rose-400 mb-2';
 document.getElementById('resultMsg').textContent=passed?'You passed the Anti-Doping Certification Exam!':'You scored below 70%. Retake the exam to get certified.';
 if(passed){
  document.getElementById('certBox').classList.remove('hidden');
  fetch('/api/certify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({athlete_name:localStorage.getItem('fp_name')||'Guest',score:score})})
  .then(r=>r.json()).then(data=>{document.getElementById('certId').textContent=data.cert_id});
 }else{
  document.getElementById('certBox').classList.add('hidden');
 }
}
loadExam();
</script>
{% endblock %}
{% endblock %}
